<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PaperGuard Smart Paper Quality Control System demo">
  <title>PaperGuard — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app"><div style="padding:40px;font-family:Arial,sans-serif">กำลังโหลด PaperGuard Demo…</div></div>
  <script>
    window.addEventListener("error", event => {
      const app = document.getElementById("app");
      if (app && event.error) app.innerHTML = `<div style="padding:40px;font-family:Arial,sans-serif;color:#b74035"><h2>PaperGuard Demo โหลดไม่สำเร็จ</h2><p>${event.error.message}</p><p>ลอง refresh หน้านี้อีกครั้ง</p></div>`;
    });
  </script>
  <script src="./js/app.js"></script>
</body>
</html>
